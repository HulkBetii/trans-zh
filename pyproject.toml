[project]
name = "zhsub"
version = "0.1.0"
description = "Pipeline dịch phụ đề tiếng Trung sang tiếng Việt / tiếng Anh"
requires-python = ">=3.11,<3.12"
dependencies = [
    # ASR — pin >=1.3.29: các bản trước dồn phụ đề tiếng Trung thành một block
    # và trả timestamp về 0.
    "funasr>=1.3.29",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "onnxruntime>=1.20",           # fsmn-vad chạy nhanh hơn khi có
    # Text
    "opencc-python-reimplemented>=0.1.7",  # phồn thể -> giản thể
    "pypinyin>=0.53",
    # Subtitle I/O
    "pysubs2>=1.8.1",
    # CLI / config / schema
    "typer>=0.27",
    "pydantic>=2.11",
    "rich>=14.0",
    # LLM providers
    "httpx>=0.28",
    # OS credential vault for API keys managed by the local Studio.
    "keyring>=25.6",
    # Ingest
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
# Provider chatgpt_web. Sau khi cài còn phải `playwright install chromium`.
# pyotp chỉ cần khi tài khoản bật MFA.
chatgpt-web = [
    "playwright>=1.40",
    "pyotp>=2.9",
]
# Giao diện web local: `zhsub web`.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
bench = [
    "faster-whisper>=1.2.1",
    "jiwer>=4.0",
    "nvidia-cublas-cu12",          # ctranslate2 cần trên Windows
    "nvidia-cudnn-cu12>=9.0",
]

[project.scripts]
zhsub = "zhsub.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "numpy>=2.0",
    "soundfile>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/zhsub/web/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/zhsub"]

# ---------------------------------------------------------------------------
# torch bản CUDA. PyPI mặc định chỉ có bản CPU trên Windows, nên phải trỏ
# thẳng vào index của PyTorch. cu128 chạy được Ampere (RTX 3060, sm_86) trở lên.
# Muốn ép CPU thuần: ZHSUB_DEVICE=cpu, hoặc đổi index sang https://download.pytorch.org/whl/cpu
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: test chạy lâu (audio dài, model thật)",
    "gpu: cần GPU NVIDIA",
    "network: cần tải model hoặc gọi API",
]
