<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zhsub</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b303a;
    --ink: #e6e8ec; --dim: #8b93a1; --accent: #6ea8fe;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 28px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 18px;
  }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  /* Xuống dòng khi hẹp: nếu không, nút Chạy bị đẩy ra ngoài khung. */
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 260px; background: #12141a; border: 1px solid var(--line); color: var(--ink);
    border-radius: 7px; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  select {
    background: #12141a; border: 1px solid var(--line); color: var(--ink);
    border-radius: 7px; padding: 10px; font-size: 14px;
  }
  button {
    background: var(--accent); color: #0d1017; border: 0; border-radius: 7px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .bar { height: 8px; background: #12141a; border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s; }
  .status { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); }
  .status b { color: var(--ink); font-weight: 600; }
  /* job_id có thể là cả tiêu đề tiếng Trung dài; cho bảng tự cuộn ngang thay vì
     đẩy cả trang rộng ra. */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 10px; border-bottom: 1px solid #23272f; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .job { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: rgba(74,222,128,.14); color: var(--ok); }
  .pill.warn { background: rgba(251,191,36,.14); color: var(--warn); }
  .pill.bad { background: rgba(248,113,113,.14); color: var(--bad); }
  .pill.dim { background: #23272f; color: var(--dim); }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 10px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>zhsub</h1>
  <div class="sub">Dịch phụ đề tiếng Trung sang tiếng Việt</div>

  <div class="panel">
    <label for="src">Đường dẫn video</label>
    <div class="row">
      <input id="src" type="text" placeholder="D:\MatAn-zh\video-8.mp4" spellcheck="false">
      <select id="target"><option value="vi">Tiếng Việt</option><option value="en">Tiếng Anh</option></select>
      <button id="go">Chạy</button>
    </div>
    <div id="live" hidden>
      <div class="bar"><i id="fill"></i></div>
      <div class="status">
        <span><b id="stage">—</b> <span id="msg"></span></span>
        <span><b id="pct">0%</b> <button id="stop" class="ghost" style="padding:2px 10px;margin-left:10px">Huỷ</button></span>
      </div>
    </div>
    <div id="err" class="err" hidden></div>
    <div class="hint">Nhận đường dẫn file, không tải lên — video 1–2 GB thì chép qua HTTP là vô nghĩa.</div>
  </div>

  <div class="panel scroll">
    <table>
      <thead><tr><th>Job</th><th>Ngắt câu</th><th>Đại từ</th><th>CPS</th><th>Câu</th><th>Trạng thái</th></tr></thead>
      <tbody id="jobs"><tr><td colspan="6" style="color:var(--dim)">Đang tải…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function pill(text, kind) { return `<span class="pill ${kind}">${text}</span>`; }

// Bốn cột giữa là bốn chỉ số từng là dấu hiệu DUY NHẤT của một lỗi âm thầm:
// rule_fallback = model bị chặn, đại từ rỗng = khối style không sinh được.
function healthCells(h) {
  if (!h) return '<td colspan="4" style="color:var(--dim)">—</td>';
  const method = h.method === 'llm' ? pill('llm', 'ok')
    : h.method === 'llm+repair' ? pill('llm+repair', 'warn')
    : h.method ? pill(h.method, 'bad') : '<span style="color:var(--dim)">—</span>';
  const pron = h.subject_pronoun ? pill(h.subject_pronoun, 'ok') : pill('chưa ghim', 'bad');
  const ratio = h.segments ? (h.cps_warnings / h.segments * 100) : 0;
  const cps = !h.segments ? '<span style="color:var(--dim)">—</span>'
    : pill(`${h.cps_warnings} (${ratio.toFixed(1)}%)`, ratio > 5 ? 'warn' : 'ok');
  return `<td>${method}</td><td>${pron}</td><td>${cps}</td><td>${h.segments || '—'}</td>`;
}

async function loadJobs() {
  const rows = await (await fetch('/api/jobs')).json();
  $('jobs').innerHTML = rows.length ? rows.map(j => {
    const st = j.status === 'done' ? pill('xong', 'ok')
      : j.status === 'running' ? pill('đang chạy', 'warn')
      : j.status === 'failed' ? pill('lỗi', 'bad') : pill(j.status, 'dim');
    return `<tr><td class="job">${j.job_id}</td>${healthCells(j.health)}<td>${st}</td></tr>`;
  }).join('') : '<tr><td colspan="6" style="color:var(--dim)">Chưa có job nào</td></tr>';
}

let current = null;

$('go').onclick = async () => {
  const source = $('src').value.trim();
  if (!source) return;
  $('err').hidden = true;
  $('go').disabled = true;

  const res = await fetch('/api/jobs', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source, target: $('target').value}),
  });
  if (!res.ok) {
    $('err').textContent = (await res.json()).detail;
    $('err').hidden = false;
    $('go').disabled = false;
    return;
  }

  current = (await res.json()).job_id;
  $('live').hidden = false;
  const es = new EventSource(`/api/jobs/${encodeURIComponent(current)}/events`);
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.done) {
      es.close();
      $('go').disabled = false;
      $('stage').textContent = d.error ? 'Dừng' : 'Xong';
      $('msg').textContent = '';
      if (d.error) { $('err').textContent = d.error; $('err').hidden = false; }
      else { $('fill').style.width = '100%'; $('pct').textContent = '100%'; }
      loadJobs();
      return;
    }
    $('fill').style.width = (d.fraction * 100).toFixed(1) + '%';
    $('pct').textContent = Math.round(d.fraction * 100) + '%';
    $('stage').textContent = d.label;
    $('msg').textContent = d.message;
  };
};

$('stop').onclick = () => current && fetch(`/api/jobs/${encodeURIComponent(current)}/cancel`, {method: 'POST'});

loadJobs();
setInterval(loadJobs, 15000);
</script>
</body>
</html>
